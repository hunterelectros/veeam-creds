name: Test SSH Connection

on:
  workflow_dispatch: # Дозволяє запускати перевірку вручну кнопкою в інтерфейсі GitHub

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key & Connect
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # 1. Створюємо папку .ssh та записуємо приватний ключ
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # 2. Додаємо сервер у список відомих хостів з урахуванням порту 22222
          ssh-keyscan -p 22222 -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          # 3. Виконуємо тестову команду на сервері від імені користувача deploy на порт 22222
          echo "Пробуємо підключитися на порт 22222..."
          ssh -p 22222 -i ~/.ssh/deploy_key deploy@"$SERVER_HOST" "echo 'Успіх! З\'єднання на порт 22222 встановлено. Аптайм сервера:' && uptime"
