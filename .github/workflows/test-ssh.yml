name: Test SSH Connection

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH Key & Connect
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SERVER_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -p 22222 -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          echo "Пробуємо підключитися на порт 22222..."
          ssh -p 22222 -i ~/.ssh/deploy_key deploy@"$SERVER_HOST" "echo 'Успіх! З\'єднання встановлено. Аптайм сервера:' && uptime"
